name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Roblox/creator-docs.git
          git fetch upstream main
          git merge upstream/main --no-edit || {
            echo "::warning::Merge conflict — manual resolution needed"
            git merge --abort
            exit 1
          }
          git push origin main
